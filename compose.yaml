services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: trumpfish
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - trumpfish-db:/var/lib/postgresql/data
    healthcheck:
      # The server applies EF Core migrations on startup, so it must not start before Postgres accepts connections.
      test: ["CMD-SHELL", "pg_isready -U postgres -d trumpfish"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Trumpfish: "Host=db;Port=5432;Database=trumpfish;Username=postgres;Password=postgres"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  trumpfish-db:
